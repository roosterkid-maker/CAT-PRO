services:
  backend:
    environment:
      CAT_PRO_RUNTIME_PROFILE: live-only
      TRADING_MODE: live
      TRADING_EXECUTION_MODE: live
      LIVE_TRADING_ENABLED: "true"
      ARBITRAGE_LIVE_CONFIRMATION: ENABLE_CONFIRMED_ARBITRAGE_EXECUTION
      CAT_PRO_LIVE_ONLY_CONFIRMATION: ENABLE_CAT_PRO_LIVE_ONLY_RUNTIME
      CAT_PRO_LIVE_TRADE_CAPITAL_INR: "1500"
      # Halt new live attempts for the rest of the IST day at this realized loss.
      CAT_PRO_LIVE_DAILY_LOSS_LIMIT_INR: "500"
      # Loss stop scales with capital (operator, 2026-09-25): 2% of the
      # deployable budget, never below the INR stop above, never above INR 5,000.
      CAT_PRO_LIVE_DAILY_LOSS_LIMIT_PERCENT: ${CAT_PRO_LIVE_DAILY_LOSS_LIMIT_PERCENT:-2}
      # INR route executor (USDT<->INR). shadow = plan from live books and
      # balances, never send. live additionally needs
      # CAT_PRO_INR_LIVE_CONFIRMATION=ENABLE_CAT_PRO_INR_ROUTE_LIVE.
      CAT_PRO_INR_LIVE_MODE: ${CAT_PRO_INR_LIVE_MODE:-live}
      CAT_PRO_INR_LIVE_VENUES: ${CAT_PRO_INR_LIVE_VENUES:-coindcx,coinswitch,unocoin}
      CAT_PRO_INR_LIVE_CONFIRMATION: ${CAT_PRO_INR_LIVE_CONFIRMATION:-ENABLE_CAT_PRO_INR_ROUTE_LIVE}
      # Per-leg size grows with deployable capital (operator, 2026-09-25): the
      # budget always covers 8 full trades; never below CAT_PRO_LIVE_TRADE_
      # CAPITAL_INR, never above this cap. Order sizes still follow book depth.
      CAT_PRO_INR_DYNAMIC_LEG_ENABLED: ${CAT_PRO_INR_DYNAMIC_LEG_ENABLED:-true}
      CAT_PRO_INR_DYNAMIC_LEG_MAX_INR: ${CAT_PRO_INR_DYNAMIC_LEG_MAX_INR:-5000}
      # Coins whose withdrawals are closed where no API says so (operator,
      # 2026-09-25: UnoCoin DASH). Seeds logs/live/exit-closed.jsonl once;
      # later changes go through POST /api/live-only/exit-cost/mark.
      CAT_PRO_EXIT_CLOSED: ${CAT_PRO_EXIT_CLOSED:-unocoin:DASH}
      # Capital manager buys core-basket stock on its sell venue (operator
      # limits 2026-09-24): core coins only, up to target, <= INR 10,000/day,
      # keeping INR 1,000 of cash on the venue, never at a > 1% premium.
      CAT_PRO_REFILL_AUTO_BUY_ENABLED: ${CAT_PRO_REFILL_AUTO_BUY_ENABLED:-true}
      CAT_PRO_REFILL_AUTO_BUY_DAILY_CAP_INR: ${CAT_PRO_REFILL_AUTO_BUY_DAILY_CAP_INR:-10000}
      CAT_PRO_REFILL_AUTO_BUY_CASH_FLOOR_INR: ${CAT_PRO_REFILL_AUTO_BUY_CASH_FLOOR_INR:-1000}
      # Capital manager v2 (operator, 2026-09-25): sell idle / surplus stock to
      # fund coins with live opportunity. Guards: <= INR 5,000/day, 24 h hold,
      # must earn 2x its cost in a day, <= 0.5% below the best other venue.
      CAT_PRO_REFILL_AUTO_SELL_ENABLED: ${CAT_PRO_REFILL_AUTO_SELL_ENABLED:-true}
      CAT_PRO_REFILL_AUTO_SELL_DAILY_CAP_INR: ${CAT_PRO_REFILL_AUTO_SELL_DAILY_CAP_INR:-5000}

      # Retired runtime controls cannot accidentally grant authority.
      AUTOMATED_PAPER_TRADING_CONFIRMATION: ""
      CAT_PRO_CENTRAL_PAPER_CONFIRMATION: ""
      CAT_PRO_CENTRAL_PAPER_STRATEGIES: ""
      CAT_PRO_SHADOW_STRATEGIES: ""
      STRATEGY_ONE_LIVE_RUNTIME_CONFIRMATION: ""
      LIVE_TRADING_CONFIRMATION: ""
      LIVE_ORDER_SUBMISSION_CONFIRMATION: ""

      # Capital Manager is intentionally enabled for LIVE-only. Cross-exchange
      # movement remains fail-closed until the dedicated key and exact
      # destination whitelist are present in backend/.env.
      CAT_PRO_REBALANCER_ENABLED: "true"

      # Same-exchange top-up only moves Binance Spot USDT into USDS-M Futures
      # margin - it exists for this codebase's perpetual/derivatives
      # strategies, none of which are running under this LIVE-only profile
      # (only Strategy #1 spot arbitrage is active here). Left enabled it
      # would periodically drain Spot USDT that Strategy #1 needs for its
      # own BUY-leg funding into unused Futures margin. Disabled here; the
      # cross-exchange path (which only rebalances Strategy #1's own Spot
      # USDT between binance/coindcx/bybit) is unaffected.
      CAT_PRO_REBALANCER_SAME_EXCHANGE_ENABLED: "false"
      CAT_PRO_REBALANCER_CROSS_EXCHANGE_ENABLED: "true"
      CAT_PRO_REBALANCER_MAX_PER_TRANSFER_USDT: ${CAT_PRO_REBALANCER_MAX_PER_TRANSFER_USDT:-25}
      CAT_PRO_REBALANCER_MAX_PER_DAY_SAME_EXCHANGE_USDT: ${CAT_PRO_REBALANCER_MAX_PER_DAY_SAME_EXCHANGE_USDT:-60}
      CAT_PRO_REBALANCER_MAX_PER_DAY_CROSS_EXCHANGE_USDT: ${CAT_PRO_REBALANCER_MAX_PER_DAY_CROSS_EXCHANGE_USDT:-150}
      CAT_PRO_REBALANCER_WITHDRAWAL_WHITELIST_JSON: ${CAT_PRO_REBALANCER_WITHDRAWAL_WHITELIST_JSON:-[]}
      # Bybit side of the capital manager (step 2): sweep Funding deposits into
      # Unified, and send spare Bybit USDT to a whitelisted exchange within the
      # same cross-exchange caps. Withdrawals also need the account holder's
      # KYC name (Bybit India Travel Rule beneficiary), set in .env.
      CAT_PRO_REBALANCER_BYBIT_FUNDING_SWEEP_ENABLED: ${CAT_PRO_REBALANCER_BYBIT_FUNDING_SWEEP_ENABLED:-true}
      CAT_PRO_REBALANCER_BYBIT_WITHDRAW_ENABLED: ${CAT_PRO_REBALANCER_BYBIT_WITHDRAW_ENABLED:-true}
      CAT_PRO_BYBIT_TRAVEL_RULE_BENEFICIARY_NAME: ${CAT_PRO_BYBIT_TRAVEL_RULE_BENEFICIARY_NAME:-}
